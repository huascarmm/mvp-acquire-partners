<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel &middot; Leads</title>
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        margin: 0;
        background: #0e1c1b;
        color: #eaf2ee;
      }
    </style>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <style>
      /* estilos propios del panel (compactos) */
      .admin {
        max-width: 1100px;
        margin: 0 auto;
        padding: 80px 20px 60px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.8rem;
        margin: 1.2rem 0;
      }
      .kpi {
        border: 1px solid var(--hair);
        border-radius: 14px;
        padding: 1rem 1.1rem;
        background: rgba(255, 255, 255, 0.02);
      }
      .kpi .n {
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .kpi .l {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin: 1.2rem 0 0.6rem;
      }
      .toolbar select,
      .toolbar input {
        background: var(--surface-2);
        border: 1px solid var(--hair);
        color: var(--text);
        border-radius: 10px;
        padding: 0.5rem 0.7rem;
        font-size: 0.92rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.6rem 0.5rem;
        border-bottom: 1px solid var(--hair);
        vertical-align: top;
      }
      th {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      tr.click {
        cursor: pointer;
      }
      tr.click:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .tag {
        font-family: var(--mono);
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        border: 1px solid var(--hair-strong);
      }
      .A {
        color: #7cf0c0;
        border-color: #7cf0c0;
      }
      .B {
        color: #9fd0ff;
        border-color: #9fd0ff;
      }
      .C {
        color: #e9d18a;
        border-color: #e9d18a;
      }
      .D {
        color: var(--muted);
      }
      .login {
        max-width: 360px;
        margin: 18vh auto 0;
        padding: 0 20px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }
      .modal.open {
        display: flex;
      }
      .sheet {
        background: var(--surface);
        border: 1px solid var(--hair-strong);
        border-radius: 16px;
        max-width: 560px;
        width: 100%;
        padding: 1.4rem;
        max-height: 84vh;
        overflow: auto;
      }
      .sheet pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--mono);
        font-size: 0.82rem;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .tabs button {
        background: transparent;
        border: 1px solid var(--hair);
        color: var(--muted);
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .tabs button.on {
        color: var(--ink);
        background: var(--accent);
        border-color: var(--accent);
      }
      /* Estados del pipeline: colorean toda la fila */
      .lead-row td { transition: background 0.15s ease; }
      .lead-row td:first-child { border-left: 3px solid transparent; }
      .st-solicitado td:first-child { border-left-color: var(--hair-strong); }
      .st-revisado { background: rgba(106,168,255,0.08); }
      .st-revisado td:first-child { border-left-color: #6aa8ff; }
      .st-agendado { background: rgba(79,209,197,0.08); }
      .st-agendado td:first-child { border-left-color: #4fd1c5; }
      .st-primera { background: rgba(183,148,246,0.08); }
      .st-primera td:first-child { border-left-color: #b794f6; }
      .st-segunda { background: rgba(246,166,224,0.08); }
      .st-segunda td:first-child { border-left-color: #f6a6e0; }
      .st-trabajando { background: rgba(95,208,168,0.10); }
      .st-trabajando td:first-child { border-left-color: #5fd0a8; }
      .st-cerrado { background: rgba(138,150,163,0.07); opacity: 0.85; }
      .st-cerrado td:first-child { border-left-color: #8a96a3; }
      .st-cerrado-fb { background: rgba(233,196,106,0.08); }
      .st-cerrado-fb td:first-child { border-left-color: #e9c46a; }

      .st-sel { background: var(--surface-2); border: 1px solid var(--hair); color: var(--text); border-radius: 8px; padding: 0.3rem 0.4rem; font-size: 0.82rem; max-width: 152px; }
      td a.open { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--hair-strong); }
      td a.open:hover { color: var(--accent); }
      .notes-inp { width: 170px; background: var(--surface-2); border: 1px solid var(--hair); color: var(--text); border-radius: 8px; padding: 0.35rem 0.5rem; font-size: 0.82rem; }
      .notes-inp:disabled { background: transparent; border-color: transparent; color: var(--muted); cursor: text; }
      .notes-inp:not(:disabled) { border-color: var(--accent); }

      /* Rating con popover */
      .rating { position: relative; display: inline-flex; flex-direction: column; }
      .stars { display: inline-flex; gap: 1px; cursor: pointer; font-size: 1.05rem; line-height: 1; }
      .star { color: #46555a; transition: color 0.1s ease; }
      .star.on { color: #e9c46a; }
      .stars:hover .star { color: #6b7a7f; }
      .rate-pop { display: none; position: absolute; top: 100%; left: 0; z-index: 5; margin-top: 0.35rem; background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 10px; padding: 0.4rem; gap: 0.35rem; align-items: center; box-shadow: 0 10px 24px -12px rgba(0,0,0,0.7); }
      .rate-pop.show { display: flex; }
      .pencil { background: transparent; border: 1px solid var(--hair); color: var(--muted); border-radius: 8px; cursor: pointer; padding: 0.25rem 0.45rem; font-size: 0.85rem; }
      .pencil:hover { color: var(--accent); border-color: var(--accent); }
      .rate-cmt { width: 180px; background: var(--surface-2); border: 1px solid var(--hair); color: var(--text); border-radius: 8px; padding: 0.3rem 0.5rem; font-size: 0.82rem; }
      .rate-cmt:disabled { color: var(--muted); }
    </style>
    <script>
      window.FIREBASE_CONFIG = {
        apiKey: "AIzaSyAkJWgRxQjo_j70svMn0pqxg_vsgx0PJ7g",
        authDomain: "colegios-285314.firebaseapp.com",
        projectId: "colegios-285314",
      };
    </script>
  </head>
  <body data-market="oro_tokenizado">
    <header class="brandbar">
      <span><b>Panel</b> &middot; Leads</span><span id="who"></span>
    </header>

    <!-- Login -->
    <div class="login" id="login">
      <div class="step">
        <p class="eyebrow">Acceso restringido</p>
        <h2 class="q">Ingresar al panel</h2>
        <div class="field">
          <label>Email</label><input id="email" type="email" />
        </div>
        <div class="field">
          <label>Contrasena</label><input id="pass" type="password" />
        </div>
        <button class="btn full" id="signin">Ingresar</button>
        <p class="foot" id="err" style="color: #f2a3a3"></p>
      </div>
    </div>

    <!-- Dashboard -->
    <main class="admin" id="dash" style="display: none">
      <div class="kpis" id="kpis"></div>

      <div class="tabs">
        <button class="on" data-tab="leads">Leads</button>
        <button data-tab="referrals">Referidos</button>
      </div>

      <div class="toolbar" id="filters">
        <select id="fMarket">
          <option value="">Todos los mercados</option>
        </select>
        <select id="fType">
          <option value="">Todos los tipos</option>
          <option>A</option>
          <option>B</option>
          <option>C</option>
          <option>D</option>
        </select>
        <select id="fStage">
          <option value="">Toda etapa</option>
          <option value="1">1 Triage</option>
          <option value="2">2 Prueba</option>
          <option value="3">3 Calificacion</option>
          <option value="4">4 Maximo valor</option>
        </select>
        <input id="fSearch" placeholder="Buscar nombre / empresa..." />
        <button class="btn ghost" id="csv">Exportar CSV</button>
      </div>

      <div id="tableWrap"></div>
    </main>

    <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

    <script type="module" src="assets/admin.js"></script>
  </body>
</html>
